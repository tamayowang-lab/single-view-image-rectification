name: RGB observer checks
on: [push, pull_request]
jobs:
  synthetic:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: active-observer run-one examples/synthetic.png --depth examples/synthetic-depth.npz --out outputs/ci
